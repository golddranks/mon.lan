# IPv4 demuxer for the web hosts in the LAN.
#
# HTTPS is routed on SNI.
# The TLS connection is left untouched, so each host keeps its own certificates.
# The map is closed: a name that is not listed is not served.

stream {
	resolver 127.0.0.1;
	map_hash_bucket_size 128;

	map $ssl_preread_server_name $https_backend {
		bitwarden.drasa.eu	[@ULA@::cafe]:443;
		cafe.drasa.eu		[@ULA@::cafe]:443;
		syncthing.drasa.eu	[@ULA@::cafe]:443;
		webshare.drasa.eu	[@ULA@::cafe]:443;
		default			127.0.0.1:1;
	}

	server {
		listen 443;
		ssl_preread on;
		proxy_pass $https_backend;
	}
}
