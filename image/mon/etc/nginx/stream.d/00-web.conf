# IPv4 web for the names hosted on cafe.
#
# HTTPS is routed on SNI with the TLS connection left untouched, so cafe keeps
# its own certificates and HTTP server. Plain HTTP has no Host header at this
# layer, so it has a single backend; per-host routing for port 80 would need an
# L7 proxy. Adding a name on a different host is one more map entry.

stream {
	resolver 127.0.0.1;
	map_hash_bucket_size 128;

	map $ssl_preread_server_name $https_backend {
		bitwarden.drasa.eu	[@ULA@::cafe]:443;
		cafe.drasa.eu		[@ULA@::cafe]:443;
		syncthing.drasa.eu	[@ULA@::cafe]:443;
		webshare.drasa.eu	[@ULA@::cafe]:443;
		default			[@ULA@::cafe]:443;
	}

	server {
		listen 443;
		ssl_preread on;
		proxy_pass $https_backend;
	}

	server {
		listen 80;
		proxy_pass [@ULA@::cafe]:80;
	}
}
