# ban is a dumb AP, but mon's checkup checks the NAT64 datapath from here: Jool
# only translates forwarded traffic, so the router cannot exercise its own
# translation, and the check needs a host on the LAN. Such a host needs a default
# route and a globally-scoped source address; the ULA provides the address.
#
# accept_ra=2 because forwarding is enabled on this box. With the default (1) the
# kernel ignores Router Advertisements on an interface whenever forwarding is on.
#
# accept_ra_pinfo=0 keeps the RA's default route and ignores its prefix
# information, so ban never forms a GUA. Otherwise dropbear binds every address
# on the bridge, which publishes ban's SSH the moment the prefix is routed.
#
# This grants ban no routing duties: it runs no DHCP or RA server, so nothing
# else learns about it.
net.ipv6.conf.default.accept_ra = 2
net.ipv6.conf.default.accept_ra_pinfo = 0
