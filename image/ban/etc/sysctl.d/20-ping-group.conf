# ghost, the unprivileged probe user, needs ICMP: the NAT64 datapath check sends
# echo requests from ban. busybox ping opens a raw socket and refuses non-root
# even with a ping group range set; iputils' ping uses ICMP datagram sockets,
# which the kernel allows for the gid range below.
net.ipv4.ping_group_range = 1000 1000
